[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencecache"
version = "0.1.0"
description = "Deterministic answer-specific evidence freshness, conflicts and refresh frontiers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lllleolin-max"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
evidencecache = "evidencecache.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
